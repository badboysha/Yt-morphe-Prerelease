name: Morphe Beta Patch → ARM64 Signed Release

on:
  workflow_dispatch:
    inputs:
      youtube_version:
        description: "YouTube version"
        required: true
        type: choice
        default: "latest"
        options:
          - "latest"
          - "21.39.522"
          - "21.38.123"
          - "21.37.42"
          - "21.28.208"
          - "21.16.256"
          - "21.13.164"
          - "20.31.42"
          - "20.21.37"

      include_experimental:
        description: "Include Experimental YouTube versions"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APKMD_REPO: "tanishqmanuja/apkmirror-downloader"
      MORPHE_REPO: "MorpheApp/morphe-desktop"
      PATCHES_REPO: "https://github.com/MorpheApp/morphe-patches"

    steps:

      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Java 21
      # -------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # -------------------------------------------------------
      # Restore YT Morphe signing keystore from Secrets
      # -------------------------------------------------------
      - name: Restore YT Morphe signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.YT_MORPHE_KEYSTORE_BASE64 }}
        run: |
          set -e

          mkdir -p signing

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: YT_MORPHE_KEYSTORE_BASE64 secret is empty."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > signing/yt-morphe-release.jks

          if [ ! -s signing/yt-morphe-release.jks ]; then
            echo "ERROR: Keystore could not be restored."
            exit 1
          fi

          echo "Keystore restored successfully."
          ls -lh signing/yt-morphe-release.jks

      # -------------------------------------------------------
      # Verify signing keystore
      # -------------------------------------------------------
      - name: Verify signing keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.YT_MORPHE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YT_MORPHE_KEY_ALIAS }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: YT_MORPHE_KEYSTORE_PASSWORD secret is empty."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: YT_MORPHE_KEY_ALIAS secret is empty."
            exit 1
          fi

          keytool -list \
            -keystore signing/yt-morphe-release.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            >/dev/null

          echo "Keystore verification successful."

      # -------------------------------------------------------
      # Download APKMirror downloader
      # -------------------------------------------------------
      - name: Download APKMirror downloader
        shell: bash
        run: |
          set -e

          mkdir -p tools downloads

          API="https://api.github.com/repos/${APKMD_REPO}/releases/latest"

          APKMD_URL="$(
            curl -fsSL "$API" |
            jq -r '.assets[]
              | select(.name == "apkmd")
              | .browser_download_url' |
            head -n 1
          )"

          if [ -z "$APKMD_URL" ] || [ "$APKMD_URL" = "null" ]; then
            echo "ERROR: APKMD binary not found."

            echo "Available assets:"
            curl -fsSL "$API" |
              jq -r '.assets[].name'

            exit 1
          fi

          echo "Downloading APKMD:"
          echo "$APKMD_URL"

          curl -fL "$APKMD_URL" \
            -o tools/apkmd

          chmod +x tools/apkmd

          echo "APKMD:"
          ./tools/apkmd --help

      # -------------------------------------------------------
      # Download Morphe Desktop
      # -------------------------------------------------------
      - name: Download Morphe Desktop
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/${MORPHE_REPO}/releases/latest"

          MORPHE_URL="$(
            curl -fsSL "$API" |
            jq -r '.assets[]
              | select(.name | test("morphe-desktop-.*-all\\.jar$"))
              | .browser_download_url' |
            head -n 1
          )"

          if [ -z "$MORPHE_URL" ] || [ "$MORPHE_URL" = "null" ]; then
            echo "ERROR: Morphe Desktop JAR not found."

            echo "Available assets:"
            curl -fsSL "$API" |
              jq -r '.assets[].name'

            exit 1
          fi

          echo "Downloading Morphe Desktop:"
          echo "$MORPHE_URL"

          curl -fL "$MORPHE_URL" \
            -o tools/morphe-desktop.jar

          echo "Morphe Desktop:"
          ls -lh tools/morphe-desktop.jar

      # -------------------------------------------------------
      # Select YouTube version
      # -------------------------------------------------------
      - name: Select YouTube version
        shell: bash
        env:
          SELECTED_VERSION: ${{ inputs.youtube_version }}
          INCLUDE_EXPERIMENTAL: ${{ inputs.include_experimental }}
        run: |
          set -e

          echo "Selected option: $SELECTED_VERSION"
          echo "Include experimental: $INCLUDE_EXPERIMENTAL"

          # ---------------------------------------------------
          # Manual version
          # ---------------------------------------------------
          if [ "$SELECTED_VERSION" != "latest" ]; then

            YT_VERSION="$SELECTED_VERSION"

            echo ""
            echo "========================================="
            echo "Manual YouTube version:"
            echo "$YT_VERSION"
            echo "========================================="

            echo "YT_VERSION=$YT_VERSION" >> "$GITHUB_ENV"

          else

            # -------------------------------------------------
            # Automatically detect latest Beta-compatible
            # YouTube version from Morphe
            # -------------------------------------------------

            echo ""
            echo "Detecting Morphe Beta YouTube versions..."

            if [ "$INCLUDE_EXPERIMENTAL" = "true" ]; then

              java -jar tools/morphe-desktop.jar \
                list-versions \
                --patches "$PATCHES_REPO" \
                --prerelease \
                --include-experimental \
                -f com.google.android.youtube \
                | tee morphe-versions.txt

            else

              java -jar tools/morphe-desktop.jar \
                list-versions \
                --patches "$PATCHES_REPO" \
                --prerelease \
                -f com.google.android.youtube \
                | tee morphe-versions.txt

            fi

            echo ""
            echo "Morphe Beta output:"
            cat morphe-versions.txt

            YT_VERSION="$(
              grep -oE '[0-9]+\.[0-9]+\.[0-9]+' morphe-versions.txt |
              head -n 1
            )"

            if [ -z "$YT_VERSION" ]; then
              echo "ERROR: Could not detect YouTube version."
              exit 1
            fi

            echo ""
            echo "========================================="
            echo "Automatically selected:"
            echo "$YT_VERSION"
            echo "========================================="

            echo "YT_VERSION=$YT_VERSION" >> "$GITHUB_ENV"

          fi

      # -------------------------------------------------------
      # Detect Latest Morphe DEV Patch Version
      # -------------------------------------------------------
      - name: Detect Morphe Patch Version
        shell: bash
        run: |
          set -e

          echo "Detecting latest Morphe DEV patch..."

          PATCH_VERSION="$(
            curl -fsSL \
              "https://api.github.com/repos/MorpheApp/morphe-patches/releases?per_page=30" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-dev\\.[0-9]+$"))
              ]
              | sort_by(.published_at)
              | last
              | .tag_name
            '
          )"

          if [ -z "$PATCH_VERSION" ] || [ "$PATCH_VERSION" = "null" ]; then
            echo "ERROR: Could not detect latest Morphe DEV patch."
            exit 1
          fi

          PATCH_VERSION="${PATCH_VERSION#v}"

          echo ""
          echo "========================================="
          echo "Latest Morphe DEV Patch:"
          echo "$PATCH_VERSION"
          echo "========================================="

          echo "PATCH_VERSION=$PATCH_VERSION" >> "$GITHUB_ENV"

      # -------------------------------------------------------
      # Confirm selected version
      # -------------------------------------------------------
      - name: Confirm YouTube version
        shell: bash
        run: |
          set -e

          if [ -z "$YT_VERSION" ]; then
            echo "ERROR: YT_VERSION is empty."
            exit 1
          fi

          echo "YouTube version selected:"
          echo "$YT_VERSION"

          echo "Morphe DEV patch version:"
          echo "$PATCH_VERSION"

      # -------------------------------------------------------
      # Download YouTube from APKMirror
      # -------------------------------------------------------
      - name: Download YouTube from APKMirror
        shell: bash
        run: |
          set -e

          rm -rf downloads
          mkdir -p downloads

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "fallbackArch": "universal",
              "dpi": "nodpi",
              "outDir": "downloads"
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${YT_VERSION}",
                "arch": "arm64-v8a",
                "fallbackArch": "universal",
                "dpi": "nodpi",
                "outFile": "youtube-${YT_VERSION}"
              }
            ]
          }
          EOF

          echo "APKMD configuration:"
          cat apps.json

          echo ""
          echo "Downloading YouTube ${YT_VERSION}..."

          ./tools/apkmd apps.json

          echo ""
          echo "Downloaded files:"
          find downloads -type f -print

          APK="$(
            find downloads \
              -type f \
              -name "*.apk" |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: YouTube APK was not downloaded."
            exit 1
          fi

          cp "$APK" youtube-original.apk

          echo ""
          echo "Original YouTube APK:"
          ls -lh youtube-original.apk

      # -------------------------------------------------------
      # Patch with Morphe Beta patches
      # -------------------------------------------------------
      - name: Patch YouTube with Morphe Beta
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Starting Morphe Beta patch"
          echo "YouTube: ${YT_VERSION}"
          echo "Patches: ${PATCH_VERSION}"
          echo "========================================="

          FINAL_APK="YT-${YT_VERSION}-Morphe-Beta-Patches-${PATCH_VERSION}.apk"

          java -jar tools/morphe-desktop.jar \
            patch \
            -p "$PATCHES_REPO" \
            --prerelease \
            -o "$FINAL_APK" \
            -r "result.json" \
            --striplibs "arm64-v8a" \
            --bytecode-mode "STRIP_SAFE" \
            youtube-original.apk

          if [ ! -f "$FINAL_APK" ]; then
            echo "ERROR: Morphe Beta APK was not created."
            exit 1
          fi

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          echo ""
          echo "========================================="
          echo "Morphe Beta patch successful"
          echo "========================================="

          ls -lh "$FINAL_APK"

      # -------------------------------------------------------
      # Optimize APK size
      # -------------------------------------------------------
      - name: Optimize APK size
        shell: bash
        run: |
          set -e

          APK="$FINAL_APK"
          TEMP_APK="${APK%.apk}-optimized.apk"
          TEMP_DIR="apk-opt"

          BEFORE_SIZE=$(stat -c%s "$APK")

          echo "========================================="
          echo "APK size before optimization"
          echo "========================================="
          ls -lh "$APK"

          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"

          unzip -q "$APK" -d "$TEMP_DIR"

          cd "$TEMP_DIR"

          # Maximum ZIP compression for APK contents.
          # Native libraries are kept uncompressed.
          zip -9 -q -r \
            "../$TEMP_APK" \
            . \
            -x "lib/*/*.so"

          if find lib -type f -name "*.so" | grep -q .; then
            find lib -type f -name "*.so" -print0 |
              xargs -0 zip -0 -q "../$TEMP_APK"
          fi

          cd ..

          if [ ! -s "$TEMP_APK" ]; then
            echo "ERROR: Optimized APK was not created."
            exit 1
          fi

          mv "$TEMP_APK" "$APK"

          AFTER_SIZE=$(stat -c%s "$APK")

          echo ""
          echo "========================================="
          echo "APK size after optimization"
          echo "========================================="
          ls -lh "$APK"

          BEFORE_MB=$(awk "BEGIN {printf \"%.2f\", $BEFORE_SIZE/1048576}")
          AFTER_MB=$(awk "BEGIN {printf \"%.2f\", $AFTER_SIZE/1048576}")

          echo ""
          echo "Before: ${BEFORE_MB} MB"
          echo "After:  ${AFTER_MB} MB"

      # -------------------------------------------------------
      # Zipalign final APK
      # -------------------------------------------------------
      - name: Zipalign final APK
        shell: bash
        run: |
          set -e

          ZIPALIGN="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "zipalign" |
            sort -V |
            tail -n 1
          )"

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          ALIGNED_APK="${FINAL_APK%.apk}-aligned.apk"

          echo "Using zipalign:"
          echo "$ZIPALIGN"

          "$ZIPALIGN" \
            -P 16 \
            -f \
            4 \
            "$FINAL_APK" \
            "$ALIGNED_APK"

          mv "$ALIGNED_APK" "$FINAL_APK"

          echo ""
          echo "Checking alignment..."

          "$ZIPALIGN" \
            -c \
            -P 16 \
            -v \
            4 \
            "$FINAL_APK"

          echo ""
          echo "Zipalign successful."

      # -------------------------------------------------------
      # Sign final APK with YT Morphe keystore
      # -------------------------------------------------------
      - name: Sign final APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.YT_MORPHE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YT_MORPHE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YT_MORPHE_KEY_PASSWORD }}
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: Keystore password secret is empty."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: Key alias secret is empty."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: Key password secret is empty."
            exit 1
          fi

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" |
            sort -V |
            tail -n 1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          SIGNED_APK="${FINAL_APK%.apk}-signed.apk"

          echo "========================================="
          echo "Signing final APK"
          echo "========================================="

          "$APKSIGNER" sign \
            --ks "signing/yt-morphe-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$FINAL_APK"

          mv "$SIGNED_APK" "$FINAL_APK"

          echo ""
          echo "APK signed successfully:"
          ls -lh "$FINAL_APK"

      # -------------------------------------------------------
      # Verify final APK signature
      # -------------------------------------------------------
      - name: Verify final APK signature
        shell: bash
        run: |
          set -e

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" |
            sort -V |
            tail -n 1
          )"

          echo "Verifying APK signature..."

          "$APKSIGNER" verify \
            --verbose \
            "$FINAL_APK"

          echo ""
          echo "========================================="
          echo "APK SIGNATURE VERIFIED"
          echo "========================================="

      # -------------------------------------------------------
      # Final APK information
      # -------------------------------------------------------
      - name: Final APK information
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "FINAL APK"
          echo "========================================="

          ls -lh "$FINAL_APK"

          echo ""
          echo "SHA-256:"
          sha256sum "$FINAL_APK"

      # -------------------------------------------------------
      # Upload signed APK artifact
      # -------------------------------------------------------
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-${{ env.YT_VERSION }}-Morphe-Beta-Signed-${{ env.PATCH_VERSION }}
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
          retention-days: 90

      # -------------------------------------------------------
      # Upload Morphe result
      # -------------------------------------------------------
      - name: Upload Morphe patch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Morphe-result-${{ env.YT_VERSION }}
          path: result.json
          if-no-files-found: warn
          retention-days: 30

      # -------------------------------------------------------
      # Create GitHub Beta Release
      # -------------------------------------------------------
      - name: Create GitHub Beta Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yt-${{ env.YT_VERSION }}-morphe-beta-${{ env.PATCH_VERSION }}
          name: YT ${{ env.YT_VERSION }} Morphe Beta - Signed

          prerelease: false

          body: |
            YouTube ${{ env.YT_VERSION }}

            Patched with Morphe Beta patches.

            Morphe DEV Patches:
            ${{ env.PATCH_VERSION }}

            Architecture:
            ARM64-v8a

            Signing:
            YT Morphe release keystore

            Optimization:
            Compressed + Zipaligned

            Signature:
            Verified

            Build:
            Morphe Beta

          files: |
            ${{ env.FINAL_APK }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
