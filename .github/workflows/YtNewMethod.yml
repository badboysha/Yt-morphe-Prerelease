name: Morphe Beta Patch → ARM64 Signed Release

on:
  workflow_dispatch:
    inputs:
      youtube_version:
        description: "YouTube version"
        required: true
        type: choice
        default: "latest"
        options:
          - "latest"
          - "21.39.522"
          - "21.38.123"
          - "21.37.42"
          - "21.28.208"
          - "21.16.256"
          - "21.13.164"
          - "20.31.42"
          - "20.21.37"

      include_experimental:
        description: "Include Experimental YouTube versions"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APKMD_REPO: "tanishqmanuja/apkmirror-downloader"
      MORPHE_REPO: "MorpheApp/morphe-desktop"
      PATCHES_REPO: "https://github.com/MorpheApp/morphe-patches"

      KEYSTORE_FILE: "signing/yt-morphe-release.jks"
      KEY_ALIAS: "yt-morphe"
      KEYSTORE_PASSWORD: "YT-Morphe-2026"
      KEY_PASSWORD: "YT-Morphe-2026"

    steps:

      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Java 21
      # -------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # -------------------------------------------------------
      # Download YT Morphe signing keystore
      # -------------------------------------------------------
      - name: Download YT Morphe signing keystore
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          mkdir -p signing

          echo "Finding latest successful keystore workflow..."

          RUN_ID="$(
            gh run list \
              --workflow "Generate YT Morphe Signing Keystore" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId'
          )"

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: No successful keystore workflow found."
            exit 1
          fi

          echo "Using keystore workflow run: $RUN_ID"

          gh run download "$RUN_ID" \
            --name "YT-Morphe-Signing-Keystore" \
            --dir signing

          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "ERROR: Keystore not found."
            find signing -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Keystore successfully downloaded:"
          ls -lh "$KEYSTORE_FILE"

      # -------------------------------------------------------
      # Download APKMirror downloader
      # -------------------------------------------------------
      - name: Download APKMirror downloader
        shell: bash
        run: |
          set -e

          mkdir -p tools downloads

          API="https://api.github.com/repos/${APKMD_REPO}/releases/latest"

          APKMD_URL="$(
            curl -fsSL "$API" |
            jq -r '.assets[]
              | select(.name == "apkmd")
              | .browser_download_url' |
            head -n 1
          )"

          if [ -z "$APKMD_URL" ] || [ "$APKMD_URL" = "null" ]; then
            echo "ERROR: APKMD binary not found."

            curl -fsSL "$API" |
              jq -r '.assets[].name'

            exit 1
          fi

          echo "Downloading APKMD:"
          echo "$APKMD_URL"

          curl -fL "$APKMD_URL" \
            -o tools/apkmd

          chmod +x tools/apkmd

          ./tools/apkmd --help

      # -------------------------------------------------------
      # Download Morphe Desktop
      # -------------------------------------------------------
      - name: Download Morphe Desktop
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/${MORPHE_REPO}/releases/latest"

          MORPHE_URL="$(
            curl -fsSL "$API" |
            jq -r '.assets[]
              | select(.name | test("morphe-desktop-.*-all\\.jar$"))
              | .browser_download_url' |
            head -n 1
          )"

          if [ -z "$MORPHE_URL" ] || [ "$MORPHE_URL" = "null" ]; then
            echo "ERROR: Morphe Desktop JAR not found."

            curl -fsSL "$API" |
              jq -r '.assets[].name'

            exit 1
          fi

          echo "Downloading Morphe Desktop:"
          echo "$MORPHE_URL"

          curl -fL "$MORPHE_URL" \
            -o tools/morphe-desktop.jar

          ls -lh tools/morphe-desktop.jar

      # -------------------------------------------------------
      # Select YouTube version
      # -------------------------------------------------------
      - name: Select YouTube version
        shell: bash
        env:
          SELECTED_VERSION: ${{ inputs.youtube_version }}
          INCLUDE_EXPERIMENTAL: ${{ inputs.include_experimental }}
        run: |
          set -e

          echo "Selected option: $SELECTED_VERSION"
          echo "Include experimental: $INCLUDE_EXPERIMENTAL"

          if [ "$SELECTED_VERSION" != "latest" ]; then

            YT_VERSION="$SELECTED_VERSION"

            echo "Manual YouTube version:"
            echo "$YT_VERSION"

            echo "YT_VERSION=$YT_VERSION" >> "$GITHUB_ENV"

          else

            echo "Detecting Morphe Beta YouTube versions..."

            if [ "$INCLUDE_EXPERIMENTAL" = "true" ]; then

              java -jar tools/morphe-desktop.jar \
                list-versions \
                --patches "$PATCHES_REPO" \
                --prerelease \
                --include-experimental \
                -f com.google.android.youtube \
                | tee morphe-versions.txt

            else

              java -jar tools/morphe-desktop.jar \
                list-versions \
                --patches "$PATCHES_REPO" \
                --prerelease \
                -f com.google.android.youtube \
                | tee morphe-versions.txt

            fi

            cat morphe-versions.txt

            YT_VERSION="$(
              grep -oE '[0-9]+\.[0-9]+\.[0-9]+' morphe-versions.txt |
              head -n 1
            )"

            if [ -z "$YT_VERSION" ]; then
              echo "ERROR: Could not detect YouTube version."
              exit 1
            fi

            echo "Automatically selected:"
            echo "$YT_VERSION"

            echo "YT_VERSION=$YT_VERSION" >> "$GITHUB_ENV"

          fi

      # -------------------------------------------------------
      # Detect latest Morphe DEV patch
      # -------------------------------------------------------
      - name: Detect Morphe Patch Version
        shell: bash
        run: |
          set -e

          echo "Detecting latest Morphe DEV patch..."

          PATCH_VERSION="$(
            curl -fsSL \
              "https://api.github.com/repos/MorpheApp/morphe-patches/releases?per_page=30" |
            jq -r '
              [
                .[]
                | select(.prerelease == true)
                | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-dev\\.[0-9]+$"))
              ]
              | sort_by(.published_at)
              | last
              | .tag_name
            '
          )"

          if [ -z "$PATCH_VERSION" ] || [ "$PATCH_VERSION" = "null" ]; then
            echo "ERROR: Could not detect latest Morphe DEV patch."
            exit 1
          fi

          PATCH_VERSION="${PATCH_VERSION#v}"

          echo "Latest Morphe DEV patch:"
          echo "$PATCH_VERSION"

          echo "PATCH_VERSION=$PATCH_VERSION" >> "$GITHUB_ENV"

      # -------------------------------------------------------
      # Confirm versions
      # -------------------------------------------------------
      - name: Confirm selected version
        shell: bash
        run: |
          set -e

          test -n "$YT_VERSION"
          test -n "$PATCH_VERSION"

          echo "YouTube: $YT_VERSION"
          echo "Morphe:  $PATCH_VERSION"

      # -------------------------------------------------------
      # Download YouTube
      # -------------------------------------------------------
      - name: Download YouTube from APKMirror
        shell: bash
        run: |
          set -e

          rm -rf downloads
          mkdir -p downloads

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "fallbackArch": "universal",
              "dpi": "nodpi",
              "outDir": "downloads"
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${YT_VERSION}",
                "arch": "arm64-v8a",
                "fallbackArch": "universal",
                "dpi": "nodpi",
                "outFile": "youtube-${YT_VERSION}"
              }
            ]
          }
          EOF

          cat apps.json

          ./tools/apkmd apps.json

          APK="$(
            find downloads \
              -type f \
              -name "*.apk" |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: YouTube APK was not downloaded."
            exit 1
          fi

          cp "$APK" youtube-original.apk

          echo "Original APK:"
          ls -lh youtube-original.apk

      # -------------------------------------------------------
      # Patch with Morphe
      # -------------------------------------------------------
      - name: Patch YouTube with Morphe Beta
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Starting Morphe Beta patch"
          echo "YouTube: ${YT_VERSION}"
          echo "Patches: ${PATCH_VERSION}"
          echo "========================================="

          FINAL_APK="YT-${YT_VERSION}-Morphe-Beta-Patches-${PATCH_VERSION}.apk"

          java -jar tools/morphe-desktop.jar \
            patch \
            -p "$PATCHES_REPO" \
            --prerelease \
            -o "$FINAL_APK" \
            -r "result.json" \
            --striplibs "arm64-v8a" \
            --bytecode-mode "STRIP_SAFE" \
            youtube-original.apk

          if [ ! -f "$FINAL_APK" ]; then
            echo "ERROR: Morphe APK was not created."
            exit 1
          fi

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          echo "Morphe patch successful:"
          ls -lh "$FINAL_APK"

      # -------------------------------------------------------
      # Compress APK
      # -------------------------------------------------------
      - name: Optimize APK compression
        shell: bash
        run: |
          set -e

          APK="$FINAL_APK"
          TEMP_APK="${APK%.apk}-compressed.apk"

          echo "Before compression:"
          ls -lh "$APK"

          mkdir -p apk-compress

          unzip -q "$APK" -d apk-compress

          cd apk-compress

          zip -9 -q -r \
            "../$TEMP_APK" \
            .

          cd ..

          if [ ! -s "$TEMP_APK" ]; then
            echo "ERROR: Compressed APK was not created."
            exit 1
          fi

          mv "$TEMP_APK" "$APK"

          echo "After compression:"
          ls -lh "$APK"

      # -------------------------------------------------------
      # Zipalign final APK
      # -------------------------------------------------------
      - name: Zipalign final APK
        shell: bash
        run: |
          set -e

          ZIPALIGN="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "zipalign" |
            sort -V |
            tail -n 1
          )"

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          ALIGNED_APK="${FINAL_APK%.apk}-aligned.apk"

          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            "$FINAL_APK" \
            "$ALIGNED_APK"

          mv "$ALIGNED_APK" "$FINAL_APK"

          echo "Checking alignment..."

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            "$FINAL_APK"

          echo "Aligned APK:"
          ls -lh "$FINAL_APK"

      # -------------------------------------------------------
      # Sign APK with same YT Morphe keystore
      # -------------------------------------------------------
      - name: Sign APK
        shell: bash
        run: |
          set -e

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" |
            sort -V |
            tail -n 1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          SIGNED_APK="${FINAL_APK%.apk}-signed.apk"

          echo "Signing with:"
          echo "Keystore: $KEYSTORE_FILE"
          echo "Alias: $KEY_ALIAS"

          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$FINAL_APK"

          mv "$SIGNED_APK" "$FINAL_APK"

          echo "Signed APK:"
          ls -lh "$FINAL_APK"

      # -------------------------------------------------------
      # Verify signature
      # -------------------------------------------------------
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "apksigner" |
            sort -V |
            tail -n 1
          )"

          "$APKSIGNER" verify \
            --verbose \
            "$FINAL_APK"

          echo ""
          echo "APK signature verification successful."

      # -------------------------------------------------------
      # Show final size
      # -------------------------------------------------------
      - name: Final APK information
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "FINAL APK"
          echo "========================================="

          ls -lh "$FINAL_APK"

          echo ""
          echo "SHA-256:"
          sha256sum "$FINAL_APK"

      # -------------------------------------------------------
      # Upload signed APK
      # -------------------------------------------------------
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-${{ env.YT_VERSION }}-Morphe-Beta-Signed-${{ env.PATCH_VERSION }}
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
          retention-days: 90

      # -------------------------------------------------------
      # Upload Morphe result
      # -------------------------------------------------------
      - name: Upload Morphe patch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Morphe-result-${{ env.YT_VERSION }}
          path: result.json
          if-no-files-found: warn

      # -------------------------------------------------------
      # GitHub Release
      # -------------------------------------------------------
      - name: Create GitHub Beta Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yt-${{ env.YT_VERSION }}-morphe-beta-${{ env.PATCH_VERSION }}
          name: YT ${{ env.YT_VERSION }} Morphe Beta - Signed

          prerelease: false

          body: |
            YouTube ${{ env.YT_VERSION }}

            Morphe Beta patches:
            ${{ env.PATCH_VERSION }}

            Architecture:
            ARM64-v8a

            APK:
            Signed with YT Morphe release keystore

            Optimization:
            Compressed + Zipaligned

            Build:
            Morphe Beta

          files: |
            ${{ env.FINAL_APK }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
