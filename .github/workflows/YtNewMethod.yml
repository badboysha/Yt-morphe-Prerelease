name: Experimental → Morphe Beta Patch → ARM64 Release

on:
  workflow_dispatch:
    inputs:
      youtube_version:
        description: "YouTube version"
        required: true
        type: choice
        default: "latest"
        options:
          - "latest"
          - "21.38.123"
          - "21.37.42"
          - "21.28.208"
          - "21.16.256"
          - "21.13.164"
          - "20.31.42"
          - "20.21.37"

      include_experimental:
        description: "Include Experimental YouTube versions"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APKMD_REPO: "tanishqmanuja/apkmirror-downloader"
      MORPHE_REPO: "MorpheApp/morphe-desktop"
      PATCHES_REPO: "https://github.com/MorpheApp/morphe-patches"

    steps:

      # -------------------------------------------------------
      # Checkout
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # Java 21
      # -------------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # -------------------------------------------------------
      # Download APKMirror downloader
      # -------------------------------------------------------
      - name: Download APKMirror downloader
        shell: bash
        run: |
          set -e

          mkdir -p tools downloads

          API="https://api.github.com/repos/${APKMD_REPO}/releases/latest"

          APKMD_URL="$(
            curl -fsSL "$API" |
            jq -r '.assets[]
              | select(.name == "apkmd")
              | .browser_download_url' |
            head -n 1
          )"

          if [ -z "$APKMD_URL" ] || [ "$APKMD_URL" = "null" ]; then
            echo "ERROR: APKMD binary not found."
            echo "Available assets:"
            curl -fsSL "$API" | jq -r '.assets[].name'
            exit 1
          fi

          echo "Downloading APKMD:"
          echo "$APKMD_URL"

          curl -fL "$APKMD_URL" -o tools/apkmd
          chmod +x tools/apkmd

          echo "APKMD:"
          ./tools/apkmd --help

      # -------------------------------------------------------
      # Download Morphe Desktop
      # -------------------------------------------------------
      - name: Download Morphe Desktop
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/${MORPHE_REPO}/releases/latest"

          MORPHE_URL="$(
            curl -fsSL "$API" |
            jq -r '.assets[]
              | select(.name | test("morphe-desktop-.*-all\\.jar$"))
              | .browser_download_url' |
            head -n 1
          )"

          if [ -z "$MORPHE_URL" ] || [ "$MORPHE_URL" = "null" ]; then
            echo "ERROR: Morphe Desktop JAR not found."

            echo "Available assets:"
            curl -fsSL "$API" |
              jq -r '.assets[].name'

            exit 1
          fi

          echo "Downloading Morphe Desktop:"
          echo "$MORPHE_URL"

          curl -fL "$MORPHE_URL" \
            -o tools/morphe-desktop.jar

          echo "Morphe Desktop:"
          ls -lh tools/morphe-desktop.jar

      # -------------------------------------------------------
      # Detect Morphe Patch Version
      # -------------------------------------------------------
      - name: Detect Morphe Patch Version
        shell: bash
        run: |
          set -e

          echo "Detecting latest Morphe pre-release patch version..."

          PATCH_API="https://api.github.com/repos/MorpheApp/morphe-patches/releases"

          PATCH_VERSION="$(
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              "$PATCH_API?per_page=30" |
            jq -r '
              .[]
              | select(.prerelease == true)
              | .tag_name
            ' |
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$' |
            head -n 1
          )"

          if [ -z "$PATCH_VERSION" ]; then
            echo "ERROR: Could not detect Morphe patch version."
            exit 1
          fi

          PATCH_VERSION="${PATCH_VERSION#v}"

          echo ""
          echo "========================================="
          echo "Morphe Patch Version:"
          echo "$PATCH_VERSION"
          echo "========================================="

          echo "PATCH_VERSION=$PATCH_VERSION" >> "$GITHUB_ENV"

      # -------------------------------------------------------
      # Select YouTube version
      # -------------------------------------------------------
      - name: Select YouTube version
        shell: bash
        env:
          SELECTED_VERSION: ${{ inputs.youtube_version }}
          INCLUDE_EXPERIMENTAL: ${{ inputs.include_experimental }}
        run: |
          set -e

          echo "Selected option: $SELECTED_VERSION"
          echo "Include experimental: $INCLUDE_EXPERIMENTAL"

          # ---------------------------------------------------
          # Manual version
          # ---------------------------------------------------
          if [ "$SELECTED_VERSION" != "latest" ]; then

            YT_VERSION="$SELECTED_VERSION"

            echo ""
            echo "========================================="
            echo "Manual YouTube version:"
            echo "$YT_VERSION"
            echo "========================================="

          else

            # -------------------------------------------------
            # Automatically detect latest compatible version
            # -------------------------------------------------

            echo ""
            echo "Detecting Morphe YouTube versions..."

            if [ "$INCLUDE_EXPERIMENTAL" = "true" ]; then

              java -jar tools/morphe-desktop.jar \
                list-versions \
                --patches "$PATCHES_REPO" \
                --prerelease \
                --include-experimental \
                -f com.google.android.youtube \
                | tee morphe-versions.txt

            else

              java -jar tools/morphe-desktop.jar \
                list-versions \
                --patches "$PATCHES_REPO" \
                --prerelease \
                -f com.google.android.youtube \
                | tee morphe-versions.txt

            fi

            echo ""
            echo "Morphe output:"
            cat morphe-versions.txt

            YT_VERSION="$(
              grep -oE '[0-9]+\.[0-9]+\.[0-9]+' morphe-versions.txt |
              head -n 1
            )"

            if [ -z "$YT_VERSION" ]; then
              echo "ERROR: Could not detect YouTube version."
              exit 1
            fi

            echo ""
            echo "========================================="
            echo "Automatically selected:"
            echo "$YT_VERSION"
            echo "========================================="

          fi

          echo "YT_VERSION=$YT_VERSION" >> "$GITHUB_ENV"

      # -------------------------------------------------------
      # Confirm versions
      # -------------------------------------------------------
      - name: Confirm Build Versions
        shell: bash
        run: |
          set -e

          if [ -z "$YT_VERSION" ]; then
            echo "ERROR: YT_VERSION is empty."
            exit 1
          fi

          if [ -z "$PATCH_VERSION" ]; then
            echo "ERROR: PATCH_VERSION is empty."
            exit 1
          fi

          echo ""
          echo "========================================="
          echo "Build information"
          echo "========================================="
          echo "YouTube Version : $YT_VERSION"
          echo "Morphe Patches  : $PATCH_VERSION"
          echo "Architecture    : ARM64-v8a"
          echo "========================================="

      # -------------------------------------------------------
      # Download YouTube from APKMirror
      # -------------------------------------------------------
      - name: Download YouTube from APKMirror
        shell: bash
        run: |
          set -e

          rm -rf downloads
          mkdir -p downloads

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "fallbackArch": "universal",
              "dpi": "nodpi",
              "outDir": "downloads"
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${YT_VERSION}",
                "arch": "arm64-v8a",
                "fallbackArch": "universal",
                "dpi": "nodpi",
                "outFile": "youtube-${YT_VERSION}"
              }
            ]
          }
          EOF

          echo "APKMD configuration:"
          cat apps.json

          echo ""
          echo "Downloading YouTube ${YT_VERSION}..."

          ./tools/apkmd apps.json

          echo ""
          echo "Downloaded files:"
          find downloads -type f -print

          APK="$(
            find downloads \
              -type f \
              -name "*.apk" |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: YouTube APK was not downloaded."
            exit 1
          fi

          cp "$APK" youtube-original.apk

          echo ""
          echo "Original YouTube APK:"
          ls -lh youtube-original.apk

      # -------------------------------------------------------
      # Optimize / align APK
      # -------------------------------------------------------
      - name: Optimize APK with Zipalign
        shell: bash
        run: |
          set -e

          ZIPALIGN="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name "zipalign" |
            sort -V |
            tail -n 1
          )"

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          echo "Using zipalign:"
          echo "$ZIPALIGN"

          "$ZIPALIGN" \
            -p \
            -f \
            4 \
            youtube-original.apk \
            youtube-aligned.apk

          echo ""
          echo "Checking alignment..."

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            youtube-aligned.apk

          echo ""
          echo "Aligned APK:"
          ls -lh youtube-aligned.apk

      # -------------------------------------------------------
      # Prepare final APK name
      # -------------------------------------------------------
      - name: Prepare APK filename
        shell: bash
        run: |
          set -e

          FINAL_APK="YT-${YT_VERSION}-Morphe-Beta-Patches-${PATCH_VERSION}-ARM64.apk"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

          echo ""
          echo "Final APK filename:"
          echo "$FINAL_APK"

      # -------------------------------------------------------
      # Patch with Morphe Beta
      # -------------------------------------------------------
      - name: Patch YouTube with Morphe Beta
        shell: bash
        run: |
          set -e

          echo "========================================="
          echo "Starting Morphe Beta patch"
          echo "========================================="
          echo "YouTube : ${YT_VERSION}"
          echo "Patches : ${PATCH_VERSION}"
          echo "========================================="

          java -jar tools/morphe-desktop.jar \
            patch \
            -p "$PATCHES_REPO" \
            --prerelease \
            -o "$FINAL_APK" \
            -r "result.json" \
            --striplibs "arm64-v8a" \
            --bytecode-mode "STRIP_SAFE" \
            youtube-aligned.apk

          if [ ! -f "$FINAL_APK" ]; then
            echo "ERROR: Morphe Beta APK was not created."
            exit 1
          fi

          echo ""
          echo "========================================="
          echo "Morphe Beta patch successful"
          echo "========================================="

          ls -lh "$FINAL_APK"

      # -------------------------------------------------------
      # Verify final APK
      # -------------------------------------------------------
      - name: Verify final APK
        shell: bash
        run: |
          set -e

          if [ ! -f "$FINAL_APK" ]; then
            echo "ERROR: Final APK not found."
            exit 1
          fi

          echo "Final APK:"
          ls -lh "$FINAL_APK"

          echo ""
          echo "APK information:"
          file "$FINAL_APK"

      # -------------------------------------------------------
      # Upload APK artifact
      # -------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-${{ env.YT_VERSION }}-Morphe-Beta-Patches-${{ env.PATCH_VERSION }}-ARM64
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error

      # -------------------------------------------------------
      # Upload Morphe result
      # -------------------------------------------------------
      - name: Upload Morphe patch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Morphe-result-${{ env.YT_VERSION }}-${{ env.PATCH_VERSION }}
          path: result.json
          if-no-files-found: warn

      # -------------------------------------------------------
      # Create separate GitHub Beta Release
      # -------------------------------------------------------
      - name: Create GitHub Beta Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yt-${{ env.YT_VERSION }}-morphe-beta-patches-${{ env.PATCH_VERSION }}
          name: YT ${{ env.YT_VERSION }} • Morphe Beta • Patches ${{ env.PATCH_VERSION }}

          prerelease: true

          generate_release_notes: false

          body: |
            ## YouTube ${{ env.YT_VERSION }}

            **Morphe Beta patched YouTube build**

            ### Build Information

            | Item | Details |
            |---|---|
            | YouTube | `${{ env.YT_VERSION }}` |
            | Morphe Patches | `${{ env.PATCH_VERSION }}` |
            | Architecture | `ARM64-v8a` |
            | Optimized | Yes |
            | Zipaligned | Yes |
            | Channel | Beta / Experimental |
            | Source | APKMirror |

            ### APK

            `${{ env.FINAL_APK }}`

            ### Patches

            This APK was patched using the Morphe pre-release patch channel.

          files: |
            ${{ env.FINAL_APK }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
