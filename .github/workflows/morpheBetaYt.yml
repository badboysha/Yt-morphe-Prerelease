name: Beta → Morphe Patch → ARM64 Release

on:
  workflow_dispatch:
    inputs:
      youtube_version:
        description: "YouTube version"
        required: true
        type: choice
        default: "latest"
        options:
          - "latest"
          - "21.38.123"
          - "21.37.42"
          - "21.28.208"
          - "21.16.256"
          - "21.13.164"
          - "20.31.42"
          - "20.21.37"

      include_experimental:
        description: "Include Experimental Morphe versions"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APKMD_REPO: "tanishqmanuja/apkmirror-downloader"
      MORPHE_REPO: "MorpheApp/morphe-desktop"
      PATCHES_REPO: "https://github.com/MorpheApp/morphe-patches"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # -------------------------------------------------------
      # Download APKMD directly from its latest GitHub release
      # -------------------------------------------------------
      - name: Download APKMirror downloader
        shell: bash
        run: |
          set -e

          mkdir -p tools downloads

          API="https://api.github.com/repos/${APKMD_REPO}/releases/latest"

          APKMD_URL=$(curl -fsSL "$API" |
            jq -r '.assets[] | select(.name == "apkmd") | .browser_download_url' |
            head -n 1)

          if [ -z "$APKMD_URL" ] || [ "$APKMD_URL" = "null" ]; then
            echo "ERROR: apkmd Linux binary was not found in latest release."
            echo "Available assets:"
            curl -fsSL "$API" | jq -r '.assets[].name'
            exit 1
          fi

          echo "Downloading APKMD:"
          echo "$APKMD_URL"

          curl -fL "$APKMD_URL" -o tools/apkmd
          chmod +x tools/apkmd

          ./tools/apkmd --help

      # -------------------------------------------------------
      # Download latest stable Morphe Desktop JAR
      # -------------------------------------------------------
      - name: Download Morphe Desktop
        shell: bash
        run: |
          set -e

          API="https://api.github.com/repos/${MORPHE_REPO}/releases/latest"

          MORPHE_URL=$(curl -fsSL "$API" |
            jq -r '.assets[] | select(.name | test("morphe-desktop-.*-all\\.jar$")) | .browser_download_url' |
            head -n 1)

          if [ -z "$MORPHE_URL" ] || [ "$MORPHE_URL" = "null" ]; then
            echo "ERROR: Morphe Desktop JAR not found."
            echo "Available assets:"
            curl -fsSL "$API" | jq -r '.assets[].name'
            exit 1
          fi

          echo "Downloading:"
          echo "$MORPHE_URL"

          curl -fL "$MORPHE_URL" \
            -o tools/morphe-desktop.jar

          echo "Morphe Desktop downloaded:"
          ls -lh tools/morphe-desktop.jar

      # -------------------------------------------------------
      # Select YouTube version
      # -------------------------------------------------------
      - name: Select YouTube version
        shell: bash
        env:
          SELECTED_VERSION: ${{ inputs.youtube_version }}
          INCLUDE_EXPERIMENTAL: ${{ inputs.include_experimental }}
        run: |
          set -e

          echo "YouTube selector: $SELECTED_VERSION"
          echo "Experimental: $INCLUDE_EXPERIMENTAL"

          if [ "$SELECTED_VERSION" != "latest" ]; then
            YT_VERSION="$SELECTED_VERSION"

            echo ""
            echo "========================================="
            echo "Manually selected YouTube version:"
            echo "$YT_VERSION"
            echo "========================================="

            echo "YT_VERSION=$YT_VERSION" >> "$GITHUB_ENV"
            exit 0
          fi

          echo ""
          echo "Detecting latest Morphe BETA-supported version..."

          if [ "$INCLUDE_EXPERIMENTAL" = "true" ]; then
            java -jar tools/morphe-desktop.jar \
              list-versions \
              --patches "$PATCHES_REPO" \
              --prerelease \
              --include-experimental \
              -f com.google.android.youtube | tee morphe-versions.txt
          else
            java -jar tools/morphe-desktop.jar \
              list-versions \
              --patches "$PATCHES_REPO" \
              --prerelease \
              -f com.google.android.youtube | tee morphe-versions.txt
          fi

          echo ""
          echo "Morphe BETA output:"
          cat morphe-versions.txt

          YT_VERSION=$(
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+' morphe-versions.txt |
            head -n 1
          )

          if [ -z "$YT_VERSION" ]; then
            echo "ERROR: Could not detect a Morphe BETA-supported YouTube version."
            exit 1
          fi

          echo ""
          echo "========================================="
          echo "Automatically selected:"
          echo "$YT_VERSION"
          echo "========================================="

          echo "YT_VERSION=$YT_VERSION" >> "$GITHUB_ENV"

      # -------------------------------------------------------
      # Download YouTube directly from APKMirror
      # -------------------------------------------------------
      - name: Download YouTube from APKMirror
        shell: bash
        run: |
          set -e

          rm -rf downloads
          mkdir -p downloads

          cat > apps.json <<EOF
          {
            "options": {
              "arch": "arm64-v8a",
              "fallbackArch": "universal",
              "dpi": "nodpi",
              "outDir": "downloads"
            },
            "apps": [
              {
                "org": "google-inc",
                "repo": "youtube",
                "version": "${YT_VERSION}",
                "arch": "arm64-v8a",
                "fallbackArch": "universal",
                "dpi": "nodpi",
                "outFile": "youtube-${YT_VERSION}"
              }
            ]
          }
          EOF

          echo "APKMD configuration:"
          cat apps.json

          echo "Starting APKMirror download..."

          ./tools/apkmd apps.json

          echo "Downloaded files:"
          find downloads -type f -print

          APK=$(find downloads -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: YouTube APK was not downloaded from APKMirror."
            exit 1
          fi

          cp "$APK" youtube-original.apk

          echo "Original YouTube APK:"
          ls -lh youtube-original.apk

      # -------------------------------------------------------
      # Optimize / align original APK before Morphe patching
      # -------------------------------------------------------
      - name: Optimize APK with Zipalign
        shell: bash
        run: |
          set -e

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "zipalign" |
            sort -V |
            tail -n 1)

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign was not found."
            exit 1
          fi

          chmod +x "$ZIPALIGN"

          echo "Using:"
          echo "$ZIPALIGN"

          "$ZIPALIGN" -p -f 4 \
            youtube-original.apk \
            youtube-aligned.apk

          echo ""
          echo "Zipalign verification:"
          "$ZIPALIGN" -c -v 4 youtube-aligned.apk

          echo ""
          echo "Optimized input APK:"
          ls -lh youtube-aligned.apk

      # -------------------------------------------------------
      # Patch YouTube with Morphe BETA patches
      # -------------------------------------------------------
      - name: Patch YouTube with Morphe
        shell: bash
        run: |
          set -e

          echo "Starting Morphe BETA patch..."
          echo "YouTube version: ${YT_VERSION}"

          java -jar tools/morphe-desktop.jar \
            patch \
            -p "$PATCHES_REPO" \
            --prerelease \
            -o "YT-${YT_VERSION}-Morphe-Beta.apk" \
            -r "result.json" \
            --striplibs "arm64-v8a" \
            --bytecode-mode "STRIP_SAFE" \
            "youtube-aligned.apk"

          if [ ! -f "YT-${YT_VERSION}-Morphe-Beta.apk" ]; then
            echo "ERROR: Patched APK was not created."
            exit 1
          fi

          echo ""
          echo "Morphe BETA patch successful:"
          ls -lh "YT-${YT_VERSION}-Morphe-Beta.apk"

      # -------------------------------------------------------
      # Verify final APK alignment
      # -------------------------------------------------------
      - name: Verify final APK
        shell: bash
        run: |
          set -e

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name "zipalign" |
            sort -V |
            tail -n 1)

          echo "Checking final APK:"
          "$ZIPALIGN" -c -v 4 \
            "YT-${YT_VERSION}-Morphe-Beta.apk"

          echo ""
          echo "Final APK:"
          ls -lh "YT-${YT_VERSION}-Morphe-Beta.apk"

      # -------------------------------------------------------
      # Upload APK as GitHub Actions artifact
      # -------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-${{ env.YT_VERSION }}-Morphe-Beta
          path: YT-${{ env.YT_VERSION }}-Morphe-Beta.apk
          if-no-files-found: error

      # -------------------------------------------------------
      # Upload Morphe result for debugging
      # -------------------------------------------------------
      - name: Upload Morphe patch result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Morphe-result-${{ env.YT_VERSION }}
          path: result.json
          if-no-files-found: warn

      # -------------------------------------------------------
      # Create GitHub Beta Release
      # -------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: yt-${{ env.YT_VERSION }}-morphe-beta
          name: YT ${{ env.YT_VERSION }} Morphe Beta
          prerelease: true
          body: |
            YouTube ${{ env.YT_VERSION }}

            Patched with Morphe Beta patches.

            Architecture:
            ARM64-v8a

            Optimized:
            Yes

            Zipaligned:
            Yes

            Source:
            APKMirror

            Build:
            Morphe Beta

            Signed:
            Yes
          files: |
            YT-${{ env.YT_VERSION }}-Morphe-Beta.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
