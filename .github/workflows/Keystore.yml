name: Generate YT Morphe Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore yt-morphe-release.jks \
            -alias yt-morphe \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "YT-Morphe-2026" \
            -keypass "YT-Morphe-2026" \
            -dname "CN=YT Morphe, OU=Morphe, O=Morphe, L=India, ST=UP, C=IN"

      - name: Show Certificate Fingerprints
        run: |
          keytool -list -v \
            -keystore yt-morphe-release.jks \
            -alias yt-morphe \
            -storepass "YT-Morphe-2026" \
            | grep -E "Alias name:|SHA1:|SHA256:|Valid from:"

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Morphe-Release-Keystore
          path: yt-morphe-release.jks
          retention-days: 90
