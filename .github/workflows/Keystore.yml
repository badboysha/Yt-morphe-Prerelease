name: Generate YT Morphe Signing Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Generate Keystore
        env:
          KEYSTORE_PASSWORD: YT-Morphe-2026
          KEY_PASSWORD: YT-Morphe-2026
        run: |
          keytool -genkeypair \
            -v \
            -keystore yt-morphe-release.jks \
            -alias yt-morphe \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=YT Morphe, OU=Morphe, O=Morphe, L=India, ST=UP, C=IN"

      - name: Show Fingerprints
        env:
          KEYSTORE_PASSWORD: YT-Morphe-2026
        run: |
          keytool -list -v \
            -keystore yt-morphe-release.jks \
            -alias yt-morphe \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -E "Alias name:|SHA1:|SHA256:|Valid from:"

      - name: Create Base64
        run: |
          base64 -w 0 yt-morphe-release.jks > yt-morphe-keystore.base64

      - name: Create Signing Information
        run: |
          cat > YT-Morphe-Signing-Info.txt <<'EOF'
          YT Morphe Signing Information
          ==============================

          Keystore:
          yt-morphe-release.jks

          Alias:
          yt-morphe

          Keystore Password:
          YT-Morphe-2026

          Key Password:
          YT-Morphe-2026

          Base64:
          The complete Base64 encoded keystore is stored in:
          yt-morphe-keystore.base64
          EOF

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Morphe-Signing-Keystore
          path: |
            yt-morphe-release.jks
            yt-morphe-keystore.base64
            YT-Morphe-Signing-Info.txt
          retention-days: 90
